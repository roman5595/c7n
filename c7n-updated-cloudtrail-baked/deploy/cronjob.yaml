# Custom-image delivery: finops_c7n/ and sitecustomize.py are baked into
# the image at build time (../Dockerfile) instead of mounted via ConfigMap.
# Trade-off vs. ../../c7n-updated-cloudtrail/: needs an image registry and a
# build/push step, in exchange for a real build-time test gate (`docker
# build` fails outright if unit tests or `c7n-org validate` fail - a bad
# build can never reach `docker push`). Bare `c7n-org`/`custodian` still
# works directly, no wrapper, no custom ENTRYPOINT - same sitecustomize.py
# mechanism as the ConfigMap variant, just baked in instead of mounted.
#
# Before applying:
#   1. Set up IAM first - see ../iam/README.md (now includes S3 + CloudWatch
#      permissions for the hub role - see ../S3-AND-METRICS-FINDINGS.md).
#   2. Fill in ../examples/accounts.yml and review ../examples/policies.yml.
#   2b. Fill in <S3_BUCKET_NAME>/<S3_PREFIX>/<REGION> in this file's command
#      block (the bucket must already exist, in this hub account).
#   3. Build and push to a registry you control:
#        docker build -t <YOUR_REGISTRY>/c7n-org-finops:<TAG> .
#        docker push <YOUR_REGISTRY>/c7n-org-finops:<TAG>
#      (the build's `test` stage runs the full unit test suite + `c7n-org
#      validate` - a failing test fails the build, nothing gets pushed)
#   4. Update `image:` below to that pushed reference.
#   5. Generate the one remaining ConfigMap (policies only - code and
#      sitecustomize are baked into the image, no longer ConfigMaps):
#        kubectl create configmap cloud-custodian-ec2-ami-policies \
#          --from-file=accounts.yml=examples/accounts.yml \
#          --from-file=policies.yml=examples/policies.yml \
#          -n monitoring --dry-run=client -o yaml > deploy/configmap-policies.yaml
#   6. kubectl apply -f deploy/serviceaccount.yaml, then
#      configmap-policies.yaml, then this file.
#   7. Leave `suspend: true` until you've triggered at least one manual run
#      with `kubectl create job --from=cronjob/cloud-custodian-ec2-ami -n monitoring ...`
#      and reviewed its logs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloud-custodian-ec2-ami
  namespace: monitoring
spec:
  schedule: '30 3 * * *'
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: cloud-custodian-ec2-ami
          # No imagePullSecrets shown here - add one if your registry is
          # private. Public ECR/Docker Hub repos don't need it.
          containers:
            - name: c7n
              image: <YOUR_REGISTRY>/c7n-org-finops:<TAG>
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  # No bootstrap module, no PYTHONPATH env var needed here -
                  # finops_c7n and sitecustomize.py are both baked into the
                  # image itself (../Dockerfile), so the bare c7n-org binary
                  # (this image's own default ENTRYPOINT) already has
                  # create-ami/verified-ami-backup/cloudtrail-detach-age
                  # available before this script even runs.
                  #
                  # Output (-s) goes straight to the hub-account S3 bucket,
                  # not a local dir - the bucket is the durable audit trail,
                  # kubectl logs are not. --metrics-uri aws://master sends
                  # CloudWatch metrics (namespace CloudMaid) to this same hub
                  # account too, regardless of which account's resources are
                  # being scanned. Both validated in ../S3-AND-METRICS-FINDINGS.md
                  # - fill in <S3_BUCKET_NAME>/<S3_PREFIX>/<REGION> below
                  # (region must be the bucket's own region).
                  c7n-org run -c /policies/accounts.yml -u /policies/policies.yml \
                    -s "s3://<S3_BUCKET_NAME>/<S3_PREFIX>?region=<REGION>" \
                    --metrics-uri "aws://master?region=<REGION>" \
                    -v
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              volumeMounts:
                - name: policies
                  mountPath: /policies
                  readOnly: true
          volumes:
            - name: policies
              configMap:
                name: cloud-custodian-ec2-ami-policies
