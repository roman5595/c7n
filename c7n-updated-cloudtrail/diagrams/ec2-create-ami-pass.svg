<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 730" width="1320" height="730" role="img" aria-label="Flow diagram: a stopped EC2 instance is tagged by wiv, then five gates must pass before Cloud Custodian creates a backup AMI and writes the FinOpsAmiId tag back onto the instance.">
  <title>EC2 create-ami pass — ec2-stopped-create-ami</title>
  <desc>Cloud Custodian policy flow: a stopped instance tagged by wiv clears five gates (live state, tag present, tag age, opt-out, no backup yet) before the automation creates a backup AMI and tags the instance with FinOpsAmiId.</desc>

  <rect x="0" y="0" width="1320" height="730" fill="#EEF3F2"/>

  <defs>
    <marker id="arrowNeutral" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#9DB3AD"/></marker>
    <marker id="arrowPass" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#1E7A46"/></marker>
    <marker id="arrowBlock" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#A23B2E"/></marker>
  </defs>

  <!-- instance stops (precondition, no tag yet) -->
  <rect x="460" y="16" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#9DB3AD" stroke-width="1.5"/>
  <text x="660" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12.5" fill="#12211E">aws.ec2 instance &#8212; State: stopped</text>
  <text x="660" y="58" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">no FinOpsStoppedDate tag yet</text>

  <line x1="660" y1="72" x2="660" y2="96" stroke="#9DB3AD" stroke-width="2" fill="none" marker-end="url(#arrowNeutral)"/>
  <text x="674" y="89" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4E6560">seen by wiv's daily scan</text>

  <!-- wiv tags it -->
  <rect x="430" y="98" width="460" height="64" rx="10" fill="#FFFFFF" stroke="#9DB3AD" stroke-width="1.5"/>
  <text x="660" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13.5" fill="#12211E">wiv &#8212; external tagger (daily)</text>
  <text x="660" y="143" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">writes FinOpsStoppedDate &#183; removes it on start</text>

  <line x1="660" y1="162" x2="660" y2="188" stroke="#9DB3AD" stroke-width="2" fill="none" marker-end="url(#arrowNeutral)"/>
  <text x="674" y="179" font-family="'Courier New', Courier, monospace" font-size="10" fill="#4E6560">T+0 tag written</text>

  <!-- trigger -->
  <text x="660" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#12211E">policy: ec2-stopped-create-ami (runs first, file order)</text>

  <line x1="660" y1="214" x2="660" y2="238" stroke="#9DB3AD" stroke-width="2" fill="none" marker-end="url(#arrowNeutral)"/>

  <text x="660" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12" fill="#12211E">5 SEQUENTIAL GATES &#8212; ALL MUST PASS</text>

  <!-- gate row -->
  <g>
    <rect x="207" y="262" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="225" cy="280" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="225" y="284" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">1</text>
    <text x="292" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">LIVE STATE</text>
    <text x="292" y="322" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">State.Name: stopped</text>
    <circle cx="223" cy="376" r="4" fill="#93551C"/>
    <text x="233" y="380" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">AWS side</text>

    <polyline points="379,325 389,332 379,339" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="391" y="262" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="409" cy="280" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="409" y="284" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">2</text>
    <text x="476" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">TAG PRESENT</text>
    <text x="476" y="322" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">FinOpsStoppedDate</text>
    <circle cx="407" cy="376" r="4" fill="#0B6169"/>
    <text x="417" y="380" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">wiv tag</text>

    <polyline points="563,325 573,332 563,339" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="575" y="262" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="593" cy="280" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="593" y="284" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">3</text>
    <text x="660" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">TAG AGE</text>
    <text x="660" y="322" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">age &gt; 14d nonprod</text>
    <text x="660" y="336" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">(30d prod)</text>
    <circle cx="591" cy="376" r="4" fill="#0B6169"/>
    <text x="601" y="380" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">wiv tag</text>

    <polyline points="747,325 757,332 747,339" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="759" y="262" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="777" cy="280" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="777" y="284" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">4</text>
    <text x="844" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">OPT-OUT</text>
    <text x="844" y="322" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">DoNotDelete</text>
    <text x="844" y="336" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">absent</text>
    <circle cx="775" cy="376" r="4" fill="#0B6169"/>
    <text x="785" y="380" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">human / wiv tag</text>

    <polyline points="931,325 941,332 931,339" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="943" y="262" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="961" cy="280" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="961" y="284" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">5</text>
    <text x="1028" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">NO BACKUP YET</text>
    <text x="1028" y="322" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">FinOpsAmiId</text>
    <text x="1028" y="336" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">absent</text>
    <circle cx="959" cy="376" r="4" fill="#0B6169"/>
    <text x="969" y="380" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">automation tag</text>
  </g>

  <!-- fork -->
  <line x1="660" y1="434" x2="660" y2="472" stroke="#1E7A46" stroke-width="2.5" fill="none" marker-end="url(#arrowPass)"/>
  <text x="674" y="458" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11.5" fill="#1E7A46">all 5 pass</text>

  <line x1="660" y1="434" x2="1145" y2="509" stroke="#A23B2E" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowBlock)"/>
  <text x="760" y="452" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#A23B2E">any fails</text>

  <rect x="1145" y="434" width="155" height="150" rx="10" fill="#FFFFFF" stroke="#A23B2E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1222" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12.5" fill="#A23B2E">&#10007; skipped</text>
  <text x="1222" y="482" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">no AMI created</text>
  <text x="1222" y="498" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">tag preserved</text>
  <text x="1222" y="514" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">re-checked</text>
  <text x="1222" y="530" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">next run</text>

  <!-- action -->
  <rect x="460" y="506" width="400" height="110" rx="10" fill="#E3EBE9" stroke="#0B6169" stroke-width="1.75"/>
  <circle cx="482" cy="526" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
  <text x="482" y="530" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">1</text>
  <text x="660" y="532" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12.5" fill="#12211E">create-ami &#8212; CreateImage</text>
  <text x="660" y="552" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">no-reboot: true</text>
  <text x="660" y="568" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">copy-tags: FinOpsStoppedDate</text>
  <text x="660" y="584" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">tags: FinOpsSource=ec2-stopped-cleanup</text>

  <line x1="660" y1="616" x2="660" y2="638" stroke="#9DB3AD" stroke-width="2" fill="none" marker-end="url(#arrowNeutral)"/>

  <!-- result -->
  <rect x="410" y="640" width="500" height="70" rx="10" fill="#D3ECEA" stroke="#0B6169" stroke-width="2"/>
  <text x="660" y="666" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13.5" fill="#12211E">Result: AMI created, FinOpsAmiId written to instance</text>
  <text x="660" y="686" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">FinOpsSource=ec2-stopped-cleanup &#183; FinOpsStoppedDate copied</text>
</svg>
