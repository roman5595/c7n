<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 636" width="1320" height="636" role="img" aria-label="Flow diagram: a stopped EC2 instance that already carries a FinOpsAmiId tag from the create-ami pass must clear seven gates — including a live AMI verification and an AWS-native state-age check — before Cloud Custodian terminates it.">
  <title>EC2 delete-with-ami pass — ec2-stopped-delete-with-ami</title>
  <desc>Cloud Custodian policy flow: an instance already tagged with FinOpsAmiId clears seven gates (live state, tag present, tag age, opt-out, backup exists, AMI verified, state age) before the automation terminates it, retaining the AMI as backup.</desc>

  <rect x="0" y="0" width="1320" height="636" fill="#EEF3F2"/>

  <defs>
    <marker id="arrowNeutral2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#9DB3AD"/></marker>
    <marker id="arrowPass2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#1E7A46"/></marker>
    <marker id="arrowBlock2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><polygon points="0,0 9,4.5 0,9" fill="#A23B2E"/></marker>
  </defs>

  <!-- input: carries over from create-ami pass -->
  <rect x="430" y="16" width="460" height="56" rx="10" fill="#FFFFFF" stroke="#9DB3AD" stroke-width="1.5"/>
  <text x="660" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12.5" fill="#12211E">aws.ec2 instance &#8212; tag:FinOpsAmiId present</text>
  <text x="660" y="58" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">AMI created earlier by ec2-stopped-create-ami</text>

  <line x1="660" y1="72" x2="660" y2="96" stroke="#9DB3AD" stroke-width="2" fill="none" marker-end="url(#arrowNeutral2)"/>

  <!-- trigger -->
  <text x="660" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#12211E">policy: ec2-stopped-delete-with-ami (runs second, same invocation)</text>

  <line x1="660" y1="122" x2="660" y2="146" stroke="#9DB3AD" stroke-width="2" fill="none" marker-end="url(#arrowNeutral2)"/>

  <text x="660" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12" fill="#12211E">7 SEQUENTIAL GATES &#8212; ALL MUST PASS</text>

  <!-- gate row -->
  <g>
    <rect x="23" y="170" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="41" cy="188" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="41" y="192" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">1</text>
    <text x="108" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">LIVE STATE</text>
    <text x="108" y="230" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">State.Name: stopped</text>
    <circle cx="39" cy="284" r="4" fill="#93551C"/>
    <text x="49" y="288" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">AWS side</text>

    <polyline points="195,233 205,240 195,247" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="207" y="170" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="225" cy="188" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="225" y="192" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">2</text>
    <text x="292" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">TAG PRESENT</text>
    <text x="292" y="230" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">FinOpsStoppedDate</text>
    <circle cx="223" cy="284" r="4" fill="#0B6169"/>
    <text x="233" y="288" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">wiv tag</text>

    <polyline points="379,233 389,240 379,247" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="391" y="170" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="409" cy="188" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="409" y="192" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">3</text>
    <text x="476" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">TAG AGE</text>
    <text x="476" y="230" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">age &gt; 14d nonprod</text>
    <text x="476" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">(30d prod)</text>
    <circle cx="407" cy="284" r="4" fill="#0B6169"/>
    <text x="417" y="288" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">wiv tag</text>

    <polyline points="563,233 573,240 563,247" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="575" y="170" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="593" cy="188" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="593" y="192" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">4</text>
    <text x="660" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">OPT-OUT</text>
    <text x="660" y="230" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">DoNotDelete</text>
    <text x="660" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">absent</text>
    <circle cx="591" cy="284" r="4" fill="#0B6169"/>
    <text x="601" y="288" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">human / wiv tag</text>

    <polyline points="747,233 757,240 747,247" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="759" y="170" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="777" cy="188" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="777" y="192" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">5</text>
    <text x="844" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">BACKUP EXISTS</text>
    <text x="844" y="230" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">FinOpsAmiId</text>
    <text x="844" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">present</text>
    <circle cx="775" cy="284" r="4" fill="#0B6169"/>
    <text x="785" y="288" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">automation tag</text>

    <polyline points="931,233 941,240 931,247" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="943" y="170" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#9DB3AD" stroke-width="1.5"/>
    <circle cx="961" cy="188" r="13" fill="#FFFFFF" stroke="#0B6169" stroke-width="2"/>
    <text x="961" y="192" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#0B6169">6</text>
    <text x="1028" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">AMI VERIFIED</text>
    <text x="1028" y="230" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">available: true</text>
    <text x="1028" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">source matches</text>
    <text x="1028" y="258" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">tags match</text>
    <circle cx="959" cy="284" r="4" fill="#93551C"/>
    <text x="969" y="288" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">AWS side</text>

    <polyline points="1115,233 1125,240 1115,247" stroke="#9DB3AD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1127" y="170" width="170" height="140" rx="10" fill="#E3EBE9" stroke="#93551C" stroke-width="2.5"/>
    <circle cx="1145" cy="188" r="13" fill="#FFFFFF" stroke="#93551C" stroke-width="2"/>
    <text x="1145" y="192" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10.5" fill="#93551C">7</text>
    <text x="1212" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#12211E">STATE AGE</text>
    <text x="1212" y="230" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">state-age &gt; 14d</text>
    <text x="1212" y="244" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">(30d prod)</text>
    <circle cx="1143" cy="284" r="4" fill="#93551C"/>
    <text x="1153" y="288" font-family="'Courier New', Courier, monospace" font-size="9" fill="#4E6560">AWS side</text>
  </g>

  <!-- fork -->
  <line x1="660" y1="342" x2="660" y2="380" stroke="#1E7A46" stroke-width="2.5" fill="none" marker-end="url(#arrowPass2)"/>
  <text x="674" y="366" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11.5" fill="#1E7A46">all 7 pass</text>

  <line x1="660" y1="342" x2="1145" y2="417" stroke="#A23B2E" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowBlock2)"/>
  <text x="760" y="360" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#A23B2E">any fails</text>

  <rect x="1145" y="342" width="155" height="150" rx="10" fill="#FFFFFF" stroke="#A23B2E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1222" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12.5" fill="#A23B2E">&#10007; kept</text>
  <text x="1222" y="390" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">not terminated</text>
  <text x="1222" y="406" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">tag preserved</text>
  <text x="1222" y="422" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">re-checked</text>
  <text x="1222" y="438" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">next run</text>

  <!-- note -->
  <rect x="430" y="400" width="460" height="24" rx="12" fill="#F2E1CC" stroke="#93551C" stroke-width="1.2"/>
  <text x="660" y="416" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="10" fill="#93551C">state-age: catches a spoofed tag (tested)</text>

  <!-- action -->
  <rect x="460" y="432" width="400" height="90" rx="10" fill="#E3EBE9" stroke="#0B6169" stroke-width="1.75"/>
  <text x="660" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12.5" fill="#12211E">terminate &#8212; TerminateInstances</text>
  <text x="660" y="480" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">issued once every gate above passes</text>
  <text x="660" y="496" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">the backup already exists and works</text>

  <line x1="660" y1="522" x2="660" y2="542" stroke="#9DB3AD" stroke-width="2" fill="none" marker-end="url(#arrowNeutral2)"/>

  <!-- result -->
  <rect x="410" y="544" width="500" height="70" rx="10" fill="#D3ECEA" stroke="#0B6169" stroke-width="2"/>
  <text x="660" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="13.5" fill="#12211E">Result: instance terminated, AMI retained</text>
  <text x="660" y="590" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#4E6560">backup lives on as the AMI from the create-ami pass</text>
</svg>
