# ConfigMap + sitecustomize.py delivery: plain upstream c7n-org image, no
# custom Docker build. finops_c7n/ and sitecustomize.py are mounted in as
# ConfigMap volumes; Python auto-executes sitecustomize.py at startup
# regardless of what command runs, so finops_c7n registers itself before
# c7n-org/custodian even starts - the bare binary works directly, no
# wrapper. See ../c7n-updated-cloudtrail-baked/ for the alternative that
# bakes the same code into a custom image instead, trading the ConfigMap
# mounts for a build/push step in exchange for a build-time test gate.
#
# Before applying:
#   1. Set up IAM first - see ../iam/README.md (now includes S3 + CloudWatch
#      permissions for the hub role - see ../S3-AND-METRICS-FINDINGS.md).
#   2. Fill in ../examples/accounts.yml and review ../examples/policies.yml.
#   2b. Fill in <S3_BUCKET_NAME>/<S3_PREFIX>/<REGION> in this file's command
#      block (the bucket must already exist, in this hub account).
#   3. Run ../scripts/test-locally.sh and confirm it passes.
#   4. Generate all three ConfigMaps:
#        kubectl create configmap cloud-custodian-ec2-ami-policies \
#          --from-file=accounts.yml=examples/accounts.yml \
#          --from-file=policies.yml=examples/policies.yml \
#          -n monitoring --dry-run=client -o yaml > deploy/configmap-policies.yaml
#        kubectl create configmap cloud-custodian-ec2-ami-code \
#          --from-file=finops_c7n/__init__.py \
#          --from-file=finops_c7n/ec2_ami.py \
#          --from-file=finops_c7n/ebs_detach.py \
#          -n monitoring --dry-run=client -o yaml > deploy/configmap-code.yaml
#        kubectl create configmap cloud-custodian-ec2-ami-sitecustomize \
#          --from-file=sitecustomize.py \
#          -n monitoring --dry-run=client -o yaml > deploy/configmap-sitecustomize.yaml
#   5. kubectl apply -f deploy/serviceaccount.yaml, then the three
#      configmap-*.yaml files, then this file.
#   6. Leave `suspend: true` until you've triggered at least one manual run
#      with `kubectl create job --from=cronjob/cloud-custodian-ec2-ami -n monitoring ...`
#      and reviewed its logs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloud-custodian-ec2-ami
  namespace: monitoring
spec:
  schedule: '30 3 * * *'
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: cloud-custodian-ec2-ami
          # No imagePullSecrets, no custom image at all - this is the public,
          # unmodified upstream image.
          containers:
            - name: c7n
              image: docker.io/cloudcustodian/c7n-org:0.9.51.0
              imagePullPolicy: IfNotPresent
              env:
                - name: PYTHONPATH
                  value: /extra-python
              command:
                - /bin/sh
                - -c
                - |
                  # No bootstrap module needed here - sitecustomize.py
                  # (mounted below) auto-registers finops_c7n before this
                  # process even starts, so the plain c7n-org binary already
                  # has create-ami/verified-ami-backup/cloudtrail-detach-age
                  # available.
                  #
                  # Output (-s) goes straight to the hub-account S3 bucket,
                  # not a local dir - the bucket is the durable audit trail,
                  # kubectl logs are not. --metrics-uri aws://master sends
                  # CloudWatch metrics (namespace CloudMaid) to this same hub
                  # account too, regardless of which account's resources are
                  # being scanned. Both validated in ../S3-AND-METRICS-FINDINGS.md
                  # - fill in <S3_BUCKET_NAME>/<S3_PREFIX>/<REGION> below
                  # (region must be the bucket's own region).
                  c7n-org run -c /policies/accounts.yml -u /policies/policies.yml \
                    -s "s3://<S3_BUCKET_NAME>/<S3_PREFIX>?region=<REGION>" \
                    --metrics-uri "aws://master?region=<REGION>" \
                    -v
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              volumeMounts:
                - name: policies
                  mountPath: /policies
                  readOnly: true
                - name: finops-code
                  mountPath: /extra-python/finops_c7n
                  readOnly: true
                - name: sitecustomize
                  mountPath: /usr/lib/python3.12/sitecustomize.py
                  # subPath: mounts only this one file, doesn't hide the rest
                  # of /usr/lib/python3.12/ (which the interpreter needs).
                  subPath: sitecustomize.py
                  readOnly: true
          volumes:
            - name: policies
              configMap:
                name: cloud-custodian-ec2-ami-policies
            - name: finops-code
              configMap:
                name: cloud-custodian-ec2-ami-code
            - name: sitecustomize
              configMap:
                name: cloud-custodian-ec2-ami-sitecustomize
