accounts:
  - name: "<ACCOUNT_NAME>"
    account_id: "<ACCOUNT_ID>"
    role: arn:aws:iam::<ACCOUNT_ID>:role/<CLUSTER_NAME>-cloud-custodian-ec2-ami-role
    regions:
      - <REGION>
      # add more regions here as needed - c7n-org fans out per region
      # automatically, no code or extra IAM required (see README)
